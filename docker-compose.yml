services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xsl-pipeline-server
    restart: unless-stopped
    volumes:
      - ./server/saxon:/app/saxon:ro
      - xsl-workdir:/app/workdir
    environment:
      - NODE_ENV=${NODE_ENV}
    networks:
      - xsl-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: xsl-pipeline-client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - xsl-net
      # proxy-net : dans le override de production

volumes:
  xsl-workdir:
    driver: local

networks:
  xsl-net:
    driver: bridge
  proxy-net:
    external: true
